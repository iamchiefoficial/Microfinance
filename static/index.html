<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Microfinance Platform | Professional Banking System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b2b26 0%, #1a4a3f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 1300px;
            background: rgba(255,255,255,0.95);
            border-radius: 2rem;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: #0f2e28;
            padding: 1.2rem 2rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo h1 {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .logo span {
            font-weight: 400;
            font-size: 0.75rem;
            color: #a8d5cc;
        }

        .main-content {
            padding: 2rem;
            min-height: 500px;
        }

        /* Login Panel */
        .login-panel {
            max-width: 480px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .login-panel h2 {
            color: #1e3e38;
            margin-bottom: 0.5rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2c5a50;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #d1e0dc;
            border-radius: 60px;
            font-size: 1rem;
            transition: 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #0f6b5c;
            box-shadow: 0 0 0 3px rgba(15,107,92,0.2);
        }

        .btn {
            border: none;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-top: 0.5rem;
        }

        .btn-primary {
            background: #1d6f5e;
            color: white;
        }

        .btn-primary:hover {
            background: #0e5547;
            transform: scale(0.98);
        }

        .btn-register {
            background: #fed7aa;
            color: #6b3e00;
            margin-top: 1rem;
        }

        .btn-register:hover {
            background: #fec887;
        }

        .btn-logout {
            background: #db3a2e;
            width: auto;
            padding: 8px 24px;
        }

        .message {
            margin-top: 1rem;
            padding: 10px;
            border-radius: 60px;
            text-align: center;
            font-weight: 500;
        }

        .error-msg {
            background: #ffe0db;
            color: #b33a2c;
        }

        .success-msg {
            background: #dff9f0;
            color: #0a5c4a;
        }

        /* Registration Modal - No Scroll */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 560px;
            border-radius: 32px;
            padding: 1.8rem 2rem;
            position: relative;
            animation: slideIn 0.2s ease;
            max-height: 95vh;
            overflow-y: auto;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-content h2 {
            color: #1e3e38;
            margin-bottom: 1rem;
        }

        .modal-content .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .modal-content .full-width {
            grid-column: span 2;
        }

        @media (max-width: 560px) {
            .modal-content .form-row {
                grid-template-columns: 1fr;
            }
            .modal-content .full-width {
                grid-column: span 1;
            }
        }

        .close-modal {
            position: absolute;
            top: 18px;
            right: 24px;
            font-size: 28px;
            cursor: pointer;
            color: #8aa69e;
            transition: 0.2s;
        }

        .close-modal:hover {
            color: #db3a2e;
        }

        /* Dashboard */
        .dashboard {
            background: white;
            border-radius: 28px;
            padding: 1.8rem;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #e2efeb;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .role-badge {
            background: #1d6f5e20;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            color: #1d6f5e;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.2rem;
            margin-bottom: 1.8rem;
        }

        .stat-card {
            background: #f9fefc;
            border-radius: 20px;
            padding: 1.2rem;
            border-left: 4px solid #1d6f5e;
        }

        .stat-card i {
            font-size: 1.8rem;
            color: #1d6f5e;
            margin-bottom: 0.5rem;
        }

        .stat-card h4 {
            font-size: 0.85rem;
            color: #5e8b80;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e3e38;
        }

        .client-list {
            background: #f9fefc;
            border-radius: 20px;
            padding: 1.2rem;
            margin-top: 1rem;
        }

        .client-list h4 {
            margin-bottom: 1rem;
            color: #1e3e38;
        }

        .client-item {
            padding: 0.8rem 0;
            border-bottom: 1px solid #e2efeb;
            display: flex;
            justify-content: space-between;
        }

        .loan-section {
            background: #f9fefc;
            border-radius: 20px;
            padding: 1.2rem;
            margin-top: 1rem;
        }

        .loan-section h4 {
            margin-bottom: 1rem;
            color: #1e3e38;
        }

        .loan-item {
            background: white;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-left: 3px solid #1d6f5e;
        }

        .loan-item h5 {
            color: #1e3e38;
            margin-bottom: 0.5rem;
        }

        .loan-item p {
            color: #5e8b80;
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
        }

        .loan-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
        }

        .btn-approve {
            background: #0a5c4a;
            color: white;
        }

        .btn-approve:hover {
            background: #084637;
        }

        .btn-reject {
            background: #db3a2e;
            color: white;
        }

        .btn-reject:hover {
            background: #c53328;
        }

        .btn-apply {
            background: #1d6f5e;
            color: white;
            width: 100%;
            margin-top: 1rem;
        }

        .btn-apply:hover {
            background: #0e5547;
        }

        .comments-input {
            width: 100%;
            padding: 8px 12px;
            border: 1.5px solid #d1e0dc;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            resize: vertical;
            min-height: 60px;
        }

        .comments-input:focus {
            outline: none;
            border-color: #0f6b5c;
            box-shadow: 0 0 0 3px rgba(15,107,92,0.2);
        }

        .hidden {
            display: none;
        }

        footer {
            background: #eef3f1;
            text-align: center;
            padding: 1rem;
            font-size: 0.75rem;
            color: #3b6b5f;
        }

        .demo-note {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 1.2rem;
            color: #8aa69e;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
    </div>
    
    <div class="main-content" id="mainContent">
        <!-- Dynamic content loaded via JS -->
        <div id="loadingSpinner" style="text-align: center; padding: 3rem;">
            <i class="fas fa-spinner fa-pulse fa-2x" style="color: #1d6f5e;"></i>
        </div>
    </div>
    
    <footer>© 2025 Microfinance Platform | Licensed by Central Bank | Secure & Reliable</footer>
</div>

<script>
    // ========== API HELPER ==========
    async function apiCall(endpoint, method, data = null) {
        const options = {
            method: method,
            headers: { 'Content-Type': 'application/json' }
        };
        if (data) options.body = JSON.stringify(data);
        const response = await fetch(endpoint, options);
        return await response.json();
    }

    // ========== CHECK SESSION ON LOAD ==========
    async function checkSession() {
        try {
            const result = await apiCall('/api/session', 'GET');
            if (result.loggedIn) {
                await loadDashboard();
            } else {
                renderLoginPage();
            }
        } catch (error) {
            console.error('Session check failed:', error);
            renderLoginPage();
        }
    }

    // ========== RENDER LOGIN PAGE ==========
    function renderLoginPage() {
        const container = document.getElementById('mainContent');
        container.innerHTML = `
            <div class="login-panel">
                <h2><i class="fas fa-waveform"></i> Login</h2>
                <div id="loginMessage"></div>
                <div class="input-group">
                    <label><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter your username">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password">
                </div>
                <button class="btn btn-primary" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
                <button class="btn btn-register" id="showRegBtn"><i class="fas fa-user-plus"></i> Register as New Client</button>
            </div>
        `;
        
        document.getElementById('loginBtn').addEventListener('click', handleLogin);
        document.getElementById('showRegBtn').addEventListener('click', showRegistrationModal);
        const pwdField = document.getElementById('loginPassword');
        if(pwdField) pwdField.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleLogin(); });
    }

    async function handleLogin() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const msgDiv = document.getElementById('loginMessage');
        
        if(!username || !password) {
            msgDiv.innerHTML = '<div class="message error-msg">⚠️ Please enter both username and password</div>';
            return;
        }
        
        const result = await apiCall('/api/login', 'POST', { username, password });
        if(result.success) {
            msgDiv.innerHTML = '<div class="message success-msg">✅ Login successful! Redirecting...</div>';
            setTimeout(() => loadDashboard(), 800);
        } else {
            msgDiv.innerHTML = `<div class="message error-msg">❌ ${result.message}</div>`;
        }
    }

    // ========== REGISTRATION MODAL (NO SCROLL) ==========
    function showRegistrationModal() {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <div id="regMessage"></div>
                <div class="form-row">
                    <div class="input-group"><label>Full Name *</label><input type="text" id="regFullName" placeholder="John Mwangi"></div>
                    <div class="input-group"><label>Email *</label><input type="email" id="regEmail" placeholder="client@example.com"></div>
                    <div class="input-group"><label>National ID *</label><input type="text" id="regNationalId" placeholder="ID Number"></div>
                    <div class="input-group"><label>Occupation *</label><input type="text" id="regOccupation" placeholder="e.g., Trader, Farmer"></div>
                    <div class="input-group"><label>Monthly Income *</label><input type="number" id="regIncome" placeholder="Amount in TZS/USD"></div>
                    <div class="input-group"><label>Username *</label><input type="text" id="regUsername" placeholder="Choose username"></div>
                    <div class="input-group"><label>Password *</label><input type="password" id="regPassword" placeholder="Create password"></div>
                    <div class="input-group"><label>Confirm Password *</label><input type="password" id="regConfirm" placeholder="Confirm password"></div>
                </div>
                <button class="btn btn-primary" id="submitRegBtn">Complete Registration</button>
            </div>
        `;
        
        document.body.appendChild(modal);
        
        const closeBtn = modal.querySelector('.close-modal');
        closeBtn.onclick = () => modal.remove();
        modal.onclick = (e) => { if(e.target === modal) modal.remove(); };
        
        document.getElementById('submitRegBtn').addEventListener('click', async () => {
            const formData = {
                fullName: document.getElementById('regFullName').value.trim(),
                email: document.getElementById('regEmail').value.trim(),
                nationalId: document.getElementById('regNationalId').value.trim(),
                occupation: document.getElementById('regOccupation').value.trim(),
                monthlyIncome: document.getElementById('regIncome').value.trim(),
                username: document.getElementById('regUsername').value.trim(),
                password: document.getElementById('regPassword').value,
                confirmPassword: document.getElementById('regConfirm').value
            };
            
            const msgDiv = document.getElementById('regMessage');
            
            if(!formData.fullName || !formData.email || !formData.nationalId || !formData.occupation || !formData.monthlyIncome || !formData.username || !formData.password) {
                msgDiv.innerHTML = '<div class="message error-msg">All fields are required!</div>';
                return;
            }
            
            const result = await apiCall('/api/register', 'POST', formData);
            if(result.success) {
                msgDiv.innerHTML = '<div class="message success-msg">✅ Registration successful! You can now login.</div>';
                setTimeout(() => { modal.remove(); }, 1500);
            } else {
                msgDiv.innerHTML = `<div class="message error-msg">❌ ${result.message}</div>`;
            }
        });
    }

    // ========== LOAD DASHBOARD (Role-based) ==========
    async function loadDashboard() {
        const container = document.getElementById('mainContent');
        container.innerHTML = '<div style="text-align: center; padding: 2rem;"><i class="fas fa-spinner fa-pulse fa-2x"></i> Loading dashboard...</div>';
        
        const result = await apiCall('/api/dashboard', 'GET');
        if(!result.success) {
            await apiCall('/api/logout', 'POST');
            renderLoginPage();
            return;
        }
        
        const data = result.dashboard;
        const role = data.role;
        const roleNames = {
            'admin': 'System Administrator',
            'general_director': 'General Director',
            'managing_director': 'Managing Director',
            'loan_manager': 'Loan Manager',
            'loan_officer': 'Loan Officer',
            'client': 'Client'
        };
        
        // Build stats HTML based on role
        let statsHtml = '';
        const stats = data.stats;
        
        if(role === 'admin') {
            statsHtml = `
                <div class="stat-card"><i class="fas fa-users"></i><h4>Total Clients</h4><div class="value">${data.totalClients}</div></div>
                <div class="stat-card"><i class="fas fa-user-tie"></i><h4>Staff Members</h4><div class="value">${stats.totalStaff || 0}</div></div>
                <div class="stat-card"><i class="fas fa-money-bill-wave"></i><h4>Total Monthly Income</h4><div class="value">${formatMoney(stats.totalMonthlyIncome || 0)}</div></div>
            `;
        } else if(role === 'general_director') {
            statsHtml = `
                <div class="stat-card"><i class="fas fa-chart-line"></i><h4>Active Clients</h4><div class="value">${data.totalClients}</div></div>
                <div class="stat-card"><i class="fas fa-chart-bar"></i><h4>Avg Client Income</h4><div class="value">${formatMoney(stats.avgClientIncome || 0)}</div></div>
                <div class="stat-card"><i class="fas fa-hand-holding-usd"></i><h4>Loan Portfolio</h4><div class="value">${formatMoney(stats.loanPortfolio || 0)}</div></div>
            `;
        } else if(role === 'managing_director') {
            statsHtml = `
                <div class="stat-card"><i class="fas fa-clock"></i><h4>Pending Approvals</h4><div class="value">${stats.pendingApprovals || 0}</div></div>
                <div class="stat-card"><i class="fas fa-percent"></i><h4>Repayment Rate</h4><div class="value">${stats.repaymentRate || 0}%</div></div>
                <div class="stat-card"><i class="fas fa-building"></i><h4>Active Branches</h4><div class="value">3</div></div>
            `;
        } else if(role === 'loan_manager') {
            statsHtml = `
                <div class="stat-card"><i class="fas fa-file-alt"></i><h4>Pending Applications</h4><div class="value">${stats.pendingApplications || 0}</div></div>
                <div class="stat-card"><i class="fas fa-check-circle"></i><h4>Active Loans</h4><div class="value">${stats.activeLoans || 0}</div></div>
                <div class="stat-card"><i class="fas fa-users"></i><h4>Total Borrowers</h4><div class="value">${data.totalClients}</div></div>
            `;
        } else if(role === 'loan_officer') {
            statsHtml = `
                <div class="stat-card"><i class="fas fa-calendar-day"></i><h4>Today's Visits</h4><div class="value">${stats.todayVisits || 0}</div></div>
                <div class="stat-card"><i class="fas fa-user-friends"></i><h4>Field Clients</h4><div class="value">${stats.fieldClients || 0}</div></div>
                <div class="stat-card"><i class="fas fa-handshake"></i><h4>Active Assignments</h4><div class="value">12</div></div>
            `;
        } else { // client
            statsHtml = `
                <div class="stat-card"><i class="fas fa-wallet"></i><h4>Monthly Income</h4><div class="value">${formatMoney(stats.monthlyIncome || 0)}</div></div>
                <div class="stat-card"><i class="fas fa-gem"></i><h4>Loan Eligibility</h4><div class="value">${formatMoney(stats.loanEligibility || 0)}</div></div>
                <div class="stat-card"><i class="fas fa-chart-simple"></i><h4>Credit Score</h4><div class="value">Excellent</div></div>
            `;
        }
        
        // Recent clients list
        let recentHtml = '<div class="client-list"><h4><i class="fas fa-history"></i> Recently Joined Clients</h4>';
        if(data.recentClients && data.recentClients.length > 0) {
            data.recentClients.forEach(client => {
                recentHtml += `<div class="client-item"><span>${client.full_name}</span><span>${formatMoney(client.monthly_income)}</span></div>`;
            });
        } else {
            recentHtml += '<div class="client-item">No clients registered yet</div>';
        }
        recentHtml += '</div>';
        
        // Add loan applications section for staff
        let loanHtml = '';
        if (role !== 'client' && role !== 'admin') {
            loanHtml = `
                <div class="loan-section">
                    <h4><i class="fas fa-hand-holding-usd"></i> Pending Loan Applications</h4>
                    <div id="pendingLoans">
                        <div style="text-align: center; padding: 1rem;">
                            <i class="fas fa-spinner fa-pulse"></i> Loading...
                        </div>
                    </div>
                </div>
            `;
        } else if (role === 'client') {
            loanHtml = `
                <div class="loan-section">
                    <h4><i class="fas fa-hand-holding-usd"></i> Apply for Loan</h4>
                    <div class="input-group">
                        <label>Loan Amount *</label>
                        <input type="number" id="loanAmount" placeholder="Enter amount">
                    </div>
                    <div class="input-group">
                        <label>Purpose *</label>
                        <input type="text" id="loanPurpose" placeholder="e.g., Business expansion, Education">
                    </div>
                    <button class="btn btn-apply" onclick="applyForLoan()"><i class="fas fa-paper-plane"></i> Submit Application</button>
                    <div id="loanMessage" style="margin-top: 1rem;"></div>
                </div>
            `;
        }
        
        container.innerHTML = `
            <div class="dashboard">
                <div class="dashboard-header">
                    <div><span class="role-badge"><i class="fas fa-id-card"></i> ${roleNames[role]} : ${data.fullName}</span></div>
                    <button class="btn btn-logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
                <div class="stats-grid">
                    ${statsHtml}
                </div>
                ${recentHtml}
                ${loanHtml}
            </div>
        `;
        
        // Load pending loans for staff
        if (role !== 'client' && role !== 'admin') {
            loadPendingLoans();
        }
    }

    // ========== LOGOUT ==========
    async function handleLogout() {
        await apiCall('/api/logout', 'POST');
        renderLoginPage();
    }

    // ========== MONEY FORMATTER ==========
    function formatMoney(amount) {
        return new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD',
            minimumFractionDigits: 0
        }).format(amount);
    }

    // ========== LOAN APPLICATION ==========
    async function applyForLoan() {
        const amount = document.getElementById('loanAmount').value.trim();
        const purpose = document.getElementById('loanPurpose').value.trim();
        const msgDiv = document.getElementById('loanMessage');
        
        if (!amount || !purpose) {
            msgDiv.innerHTML = '<div class="message error-msg">⚠️ Please fill in all fields</div>';
            return;
        }
        
        const result = await apiCall('/api/loan/apply', 'POST', { amount, purpose });
        if (result.success) {
            msgDiv.innerHTML = '<div class="message success-msg">✅ Loan application submitted successfully!</div>';
            document.getElementById('loanAmount').value = '';
            document.getElementById('loanPurpose').value = '';
        } else {
            msgDiv.innerHTML = `<div class="message error-msg">❌ ${result.message}</div>`;
        }
    }

    // ========== LOAD PENDING LOANS ==========
    async function loadPendingLoans() {
        const container = document.getElementById('pendingLoans');
        if (!container) return;
        
        try {
            const result = await apiCall('/api/loan/pending', 'GET');
            if (result.success && result.loans.length > 0) {
                let loansHtml = '';
                result.loans.forEach(loan => {
                    loansHtml += `
                        <div class="loan-item" id="loan-${loan.id}">
                            <h5>${loan.client_name}</h5>
                            <p><strong>Amount:</strong> ${formatMoney(loan.amount)}</p>
                            <p><strong>Purpose:</strong> ${loan.purpose}</p>
                            <p><strong>Applied:</strong> ${new Date(loan.created_at).toLocaleDateString()}</p>
                            <textarea class="comments-input" id="comments-${loan.id}" placeholder="Add comments (optional)"></textarea>
                            <div class="loan-actions">
                                <button class="btn-small btn-approve" onclick="processLoan(${loan.id}, 'approved')">
                                    <i class="fas fa-check"></i> Approve
                                </button>
                                <button class="btn-small btn-reject" onclick="processLoan(${loan.id}, 'rejected')">
                                    <i class="fas fa-times"></i> Reject
                                </button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = loansHtml;
            } else {
                container.innerHTML = '<div style="text-align: center; padding: 1rem; color: #5e8b80;">No pending loan applications</div>';
            }
        } catch (error) {
            container.innerHTML = '<div style="text-align: center; padding: 1rem; color: #db3a2e;">Error loading loan applications</div>';
        }
    }

    // ========== PROCESS LOAN DECISION ==========
    async function processLoan(loanId, decision) {
        const comments = document.getElementById(`comments-${loanId}`).value.trim();
        const loanItem = document.getElementById(`loan-${loanId}`);
        
        // Show loading state
        loanItem.style.opacity = '0.6';
        const buttons = loanItem.querySelectorAll('.btn-small');
        buttons.forEach(btn => btn.disabled = true);
        
        try {
            const result = await apiCall('/api/loan/approve', 'POST', {
                loan_id: loanId,
                decision: decision,
                comments: comments
            });
            
            if (result.success) {
                // Remove the processed loan item
                loanItem.style.transition = 'opacity 0.3s';
                loanItem.style.opacity = '0';
                setTimeout(() => {
                    loanItem.remove();
                    // Check if there are no more loans
                    const remainingLoans = document.querySelectorAll('.loan-item');
                    if (remainingLoans.length === 0) {
                        document.getElementById('pendingLoans').innerHTML = 
                            '<div style="text-align: center; padding: 1rem; color: #5e8b80;">No pending loan applications</div>';
                    }
                }, 300);
            } else {
                // Show error and restore buttons
                alert(`Error: ${result.message}`);
                loanItem.style.opacity = '1';
                buttons.forEach(btn => btn.disabled = false);
            }
        } catch (error) {
            alert('Error processing loan decision');
            loanItem.style.opacity = '1';
            buttons.forEach(btn => btn.disabled = false);
        }
    }

    // ========== INITIALIZE ==========
    document.addEventListener('DOMContentLoaded', checkSession);
</script>
</body>
</html>
