<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{% block title %}Microfinance Platform | Professional Banking System{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b2b26 0%, #1a4a3f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 1300px;
            background: rgba(255,255,255,0.95);
            border-radius: 2rem;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: #0f2e28;
            padding: 1.2rem 2rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo h1 {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .logo span {
            font-weight: 400;
            font-size: 0.75rem;
            color: #a8d5cc;
        }

        .main-content {
            padding: 2rem;
            min-height: 500px;
        }

        /* Login Panel */
        .login-panel {
            max-width: 480px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .login-panel h2 {
            color: #1e3e38;
            margin-bottom: 0.5rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2c5a50;
        }

        .input-group input, .input-group textarea, .input-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #d1e0dc;
            border-radius: 60px;
            font-size: 1rem;
            transition: 0.2s;
        }

        .input-group textarea {
            border-radius: 20px;
            resize: vertical;
            min-height: 60px;
        }

        .input-group input:focus, .input-group textarea:focus, .input-group select:focus {
            outline: none;
            border-color: #0f6b5c;
            box-shadow: 0 0 0 3px rgba(15,107,92,0.2);
        }

        .btn {
            border: none;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-top: 0.5rem;
        }

        .btn-primary {
            background: #1d6f5e;
            color: white;
        }

        .btn-primary:hover {
            background: #0e5547;
            transform: scale(0.98);
        }

        .btn-register {
            background: #fed7aa;
            color: #6b3e00;
            margin-top: 1rem;
        }

        .btn-register:hover {
            background: #fec887;
        }

        .btn-logout {
            background: #db3a2e;
            width: auto;
            padding: 8px 24px;
        }

        .message {
            margin-top: 1rem;
            padding: 10px;
            border-radius: 60px;
            text-align: center;
            font-weight: 500;
        }

        .error-msg {
            background: #ffe0db;
            color: #b33a2c;
        }

        .success-msg {
            background: #dff9f0;
            color: #0a5c4a;
        }

        /* Dashboard */
        .dashboard {
            background: white;
            border-radius: 28px;
            padding: 1.8rem;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #e2efeb;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .role-badge {
            background: #1d6f5e20;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            color: #1d6f5e;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.2rem;
            margin-bottom: 1.8rem;
        }

        .stat-card {
            background: #f9fefc;
            border-radius: 20px;
            padding: 1.2rem;
            border-left: 4px solid #1d6f5e;
        }

        .stat-card i {
            font-size: 1.8rem;
            color: #1d6f5e;
            margin-bottom: 0.5rem;
        }

        .stat-card h4 {
            font-size: 0.85rem;
            color: #5e8b80;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e3e38;
        }

        .client-list, .loan-section {
            background: #f9fefc;
            border-radius: 20px;
            padding: 1.2rem;
            margin-top: 1rem;
        }

        .client-list h4, .loan-section h4 {
            margin-bottom: 1rem;
            color: #1e3e38;
        }

        .client-item {
            padding: 0.8rem 0;
            border-bottom: 1px solid #e2efeb;
            display: flex;
            justify-content: space-between;
        }

        .loan-item {
            background: white;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-left: 3px solid #1d6f5e;
        }

        .loan-item h5 {
            color: #1e3e38;
            margin-bottom: 0.5rem;
        }

        .loan-item p {
            color: #5e8b80;
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
        }

        .loan-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
        }

        .btn-approve {
            background: #0a5c4a;
            color: white;
        }

        .btn-approve:hover {
            background: #084637;
        }

        .btn-reject {
            background: #db3a2e;
            color: white;
        }

        .btn-reject:hover {
            background: #c53328;
        }

        .btn-apply {
            background: #1d6f5e;
            color: white;
            width: 100%;
            margin-top: 1rem;
        }

        .btn-apply:hover {
            background: #0e5547;
        }

        .hidden {
            display: none;
        }

        footer {
            background: #eef3f1;
            text-align: center;
            padding: 1rem;
            font-size: 0.75rem;
            color: #3b6b5f;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div><i class="fas fa-shield-alt"></i> Secure Banking Platform</div>
    </div>
    
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
    
    <footer>© 2025 Microfinance Platform | Licensed by Central Bank | Secure & Reliable</footer>
</div>
</body>
</html>
