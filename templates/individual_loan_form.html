<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Individual Loan Application - Orethan Microfinance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #2c5aa6;
        }
        
        .company-name {
            font-size: 24px;
            font-weight: bold;
            color: #2c5aa6;
        }
        
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        button {
            background: #28a745;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        
        button:hover {
            background: #218838;
        }
        
        .back-btn {
            background: #6c757d;
            margin-bottom: 20px;
            width: auto;
            padding: 8px 20px;
        }
        
        .back-btn:hover {
            background: #5a6268;
        }
        
        .alert {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <a href="{{ url_for('client_dashboard') }}" class="back-btn">← Back to Dashboard</a>
        
        <div class="header">
            <div class="company-name">🏦 ORETHAN MICROFINANCE</div>
            <h2>Individual Loan Application</h2>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST" action="{{ url_for('submit_individual_loan') }}">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" value="{{ user.full_name or user.username }}" readonly>
            </div>
            
            <div class="form-group">
                <label>Loan Amount (Tsh)</label>
                <input type="number" name="amount" required min="100000" step="50000" placeholder="Enter amount">
            </div>
            
            <div class="form-group">
                <label>Purpose of Loan</label>
                <select name="purpose" required>
                    <option value="">Select purpose</option>
                    <option value="Business Expansion">Business Expansion</option>
                    <option value="Education">Education</option>
                    <option value="Medical">Medical</option>
                    <option value="Home Improvement">Home Improvement</option>
                    <option value="Agriculture">Agriculture</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Repayment Period (months)</label>
                <select name="term_months" required>
                    <option value="6">6 months</option>
                    <option value="12">12 months</option>
                    <option value="18">18 months</option>
                    <option value="24">24 months</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Monthly Income (Tsh)</label>
                <input type="number" name="monthly_income" required placeholder="Your monthly income">
            </div>
            
            <button type="submit">Submit Application</button>
        </form>
    </div>
</body>
</html>
